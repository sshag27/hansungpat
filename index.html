<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한성팟 - 한성대 일상 소통 및 모임 매칭 플랫폼</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FontAwesome (Fallback/Extra) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'hsu-blue': '#004098',
                        'hsu-blue-light': '#1A5BB8',
                        'hsu-pink': '#FF6B8B',
                        'hsu-pink-soft': '#FFE5EB',
                        'hsu-yellow': '#FFD02B',
                        'hsu-bg': '#F4F6F9',
                    },
                    boxShadow: {
                        'card': '0 4px 15px rgba(0, 64, 152, 0.06)',
                        'floating': '0 8px 25px rgba(0, 64, 152, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #0f172a;
            user-select: none;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .animate-bounce-short {
            animation: bounceShort 0.6s ease-in-out infinite alternate;
        }
        @keyframes bounceShort {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <div id="root" class="w-full max-w-md h-[100vh] sm:h-[844px] bg-white sm:rounded-[36px] shadow-2xl overflow-hidden relative flex flex-col border-0 sm:border-[8px] border-slate-800"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Mock Initial Data ---
        const INITIAL_POSTS = [
            {
                id: 1,
                category: '밥',
                categoryIcon: '🍚',
                title: '오늘 14:00에 밥 드실분 2명 구해여',
                description: '상상관 학식에서 돈까스나 비빔밥 먹으려고 합니다! 혼밥 심심하신 분 부담없이 와주세요.',
                date: '2026-10-31',
                dateLabel: '오늘',
                time: '14:00',
                location: '상상관 학식',
                currentMembers: 2,
                maxMembers: 3,
                host: '이지은',
                hostRole: '경영학과 23학번',
                isMultilingual: true,
                status: '모집중'
            },
            {
                id: 2,
                category: '공부',
                categoryIcon: '📚',
                title: '미분적분학 과제 같이 풀어볼 사람!',
                description: '탐구관 3층 스터디룸 예약해뒀습니다. 3번 4번 문제 집중적으로 같이 풀어봐요.',
                date: '2026-10-31',
                dateLabel: '오늘',
                time: '16:30',
                location: '탐구관 3층 스터디룸',
                currentMembers: 1,
                maxMembers: 4,
                host: '박서준',
                hostRole: 'AI응용학과 22학번',
                isMultilingual: false,
                status: '모집중'
            },
            {
                id: 3,
                category: '취미',
                categoryIcon: '🎨',
                title: '이번 주말에 성신여대 보드게임카페 가실 분',
                description: '스플렌더랑 루미큐브 할 겁니다! 왕초보 환영합니다 혜화나 성신여대 근처!',
                date: '2026-11-01',
                dateLabel: '내일',
                time: '15:00',
                location: '성신여대입구역 2번출구',
                currentMembers: 3,
                maxMembers: 4,
                host: '최민수',
                hostRole: '기계전자공학부 21학번',
                isMultilingual: true,
                status: '모집중'
            },
            {
                id: 4,
                category: '기타',
                categoryIcon: '🎈',
                title: '성신여대입구역에서 한성대 정문까지 택시 팟',
                description: '8시 45분쯤 역 앞에서 모여서 택시 같이 타고 가실 분 구합니다. 2명만 더!',
                date: '2026-11-02',
                dateLabel: '월요일',
                time: '08:45',
                location: '성신여대입구역 3번출구',
                currentMembers: 2,
                maxMembers: 4,
                host: '김수영',
                hostRole: '디자인학부 24학번',
                isMultilingual: false,
                status: '모집중'
            }
        ];

        // Component: Top Logo & Mascot Header
        const TopHeader = ({ points, activeTab }) => {
            return (
                <div className="bg-hsu-blue text-white px-5 pt-4 pb-3 flex items-center justify-between shadow-md relative z-20">
                    <div className="flex items-center gap-2.5">
                        {/* Mascot Icon (Sangsangbugi with Pink Post-it face) */}
                        <div className="relative w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-inner border-2 border-hsu-yellow">
                            {/* Turtle shell/ears shape hint */}
                            <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center relative">
                                {/* Post-it note on forehead/face */}
                                <div className="w-6 h-6 bg-hsu-pink rounded-sm shadow-sm flex flex-col items-center justify-center transform -rotate-3 border border-pink-300">
                                    <span className="text-[9px] text-white font-bold leading-none mb-0.5">ω</span>
                                    <span className="text-[7px] text-white font-black leading-none">•̀.•́</span>
                                </div>
                            </div>
                            {/* HSU backpack badge mini */}
                            <span className="absolute -bottom-1 -right-1 bg-hsu-yellow text-hsu-blue text-[8px] font-extrabold px-1 rounded-full border border-white">
                                HSU
                            </span>
                        </div>
                        <div>
                            <div className="flex items-center gap-1.5">
                                <h1 className="text-xl font-black tracking-tight text-white leading-none">한성팟</h1>
                            </div>
                            <p className="text-[10px] text-blue-200 mt-0.5 font-medium">한성대 재학생 전용 모임 매칭</p>
                        </div>
                    </div>

                    {/* Point Indicator */}
                    <div className="bg-white/10 hover:bg-white/20 transition-all border border-white/20 rounded-full px-3 py-1 flex items-center gap-1.5 cursor-pointer">
                        <div className="w-4 h-4 rounded-full bg-hsu-yellow text-hsu-blue flex items-center justify-center font-black text-[10px] shadow">
                            P
                        </div>
                        <span className="text-xs font-bold text-white tracking-wide">{points} <span className="text-[10px] text-blue-200 font-normal">pt</span></span>
                    </div>
                </div>
            );
        };

        // Component: Main Application
        function App() {
            const [activeTab, setActiveTab] = useState('feed'); // 'feed', 'chat', 'mypage'
            const [posts, setPosts] = useState(INITIAL_POSTS);
            const [selectedCategory, setSelectedCategory] = useState('전체');
            const [selectedDateFilter, setSelectedDateFilter] = useState('전체');
            const [customDate, setCustomDate] = useState('');
            const [isDatePickerOpen, setIsDatePickerOpen] = useState(false);
            
            // Modals
            const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
            const [selectedPost, setSelectedPost] = useState(null);
            const [activeChatPost, setActiveChatPost] = useState(null);
            
            // Verification / Manner Rating Modal
            const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);
            const [uploadedPhoto, setUploadedPhoto] = useState(null);
            const [selectedBadges, setSelectedBadges] = useState([]);
            const [reviewText, setReviewText] = useState('');
            const [rewardToast, setRewardToast] = useState(false);

            // User Points State
            const [userPoints, setUserPoints] = useState(14); // out of 20 weekly limit
            const [weeklyHistory, setWeeklyHistory] = useState([
                { id: 1, title: '우촌관 학식 밥팟 완료', date: '10월 29일', points: '+2pt' },
                { id: 2, title: '알고리즘 스터디 모임 완료', date: '10월 28일', points: '+2pt' },
                { id: 3, title: '성 성북천 러닝 모임 완료', date: '10월 27일', points: '+2pt' },
            ]);

            // Translation Toggle State in Chat
            const [showTranslations, setShowTranslations] = useState({});

            // Form State for New Room Creation
            const [newCategory, setNewCategory] = useState('밥');
            const [newTitle, setNewTitle] = useState('');
            const [newDesc, setNewDesc] = useState('');
            const [newTime, setNewTime] = useState('14:00');
            const [newLocation, setNewLocation] = useState('상상관 학식');
            const [newMaxMembers, setNewMaxMembers] = useState(3);
            const [newMultilingual, setNewMultilingual] = useState(true);
            const [newDateType, setNewDateType] = useState('오늘');

            // Category configuration
            const categories = [
                { id: '전체', label: '전체', icon: '🌟' },
                { id: '밥', label: '밥', icon: '🍚' },
                { id: '취미', label: '취미', icon: '🎨' },
                { id: '공부', label: '공부', icon: '📚' },
                { id: '기타', label: '기타', icon: '🎈' },
            ];

            // Filter logic
            const filteredPosts = posts.filter(post => {
                const categoryMatch = selectedCategory === '전체' || post.category === selectedCategory;
                
                let dateMatch = true;
                if (selectedDateFilter === '오늘') {
                    dateMatch = post.dateLabel === '오늘' || post.date === '2026-10-31';
                } else if (selectedDateFilter === '내일') {
                    dateMatch = post.dateLabel === '내일' || post.date === '2026-11-01';
                } else if (selectedDateFilter === 'CUSTOM' && customDate) {
                    dateMatch = post.date === customDate;
                }

                return categoryMatch && dateMatch;
            });

            // Handlers
            const handleCreateRoom = (e) => {
                e.preventDefault();
                if (!newTitle.trim()) return;

                const newPostObj = {
                    id: Date.now(),
                    category: newCategory,
                    categoryIcon: categories.find(c => c.id === newCategory)?.icon || '🎈',
                    title: newTitle,
                    description: newDesc || '함께해요!',
                    date: newDateType === '오늘' ? '2026-10-31' : '2026-11-01',
                    dateLabel: newDateType,
                    time: newTime,
                    location: newLocation,
                    currentMembers: 1,
                    maxMembers: Number(newMaxMembers),
                    host: '김준회',
                    hostRole: 'IT공과대학 1학년 (나)',
                    isMultilingual: newMultilingual,
                    status: '모집중'
                };

                setPosts([newPostObj, ...posts]);
                setIsCreateModalOpen(false);
                setNewTitle('');
                setNewDesc('');
            };

            const handleJoinRoom = (post) => {
                setActiveChatPost(post);
                setSelectedPost(null);
                setActiveTab('chat');
            };

            const toggleTranslation = (msgId) => {
                setShowTranslations(prev => ({
                    ...prev,
                    [msgId]: !prev[msgId]
                }));
            };

            const handleBadgeToggle = (badge) => {
                if (selectedBadges.includes(badge)) {
                    setSelectedBadges(selectedBadges.filter(b => b !== badge));
                } else {
                    setSelectedBadges([...selectedBadges, badge]);
                }
            };

            const handleCompleteActivity = () => {
                if (userPoints < 20) {
                    setUserPoints(prev => Math.min(20, prev + 2));
                    setWeeklyHistory([
                        { id: Date.now(), title: `${activeChatPost?.title || '모임'} 인증 완료`, date: '오늘', points: '+2pt' },
                        ...weeklyHistory
                    ]);
                }
                setIsReviewModalOpen(false);
                setRewardToast(true);
                setTimeout(() => setRewardToast(false), 3500);
            };

            return (
                <div className="flex flex-col h-full bg-hsu-bg relative font-sans overflow-hidden">
                    
                    {/* Top Header */}
                    <TopHeader points={userPoints} activeTab={activeTab} />

                    {/* Reward Toast Notice */}
                    {rewardToast && (
                        <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 w-11/12 bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl border-2 border-hsu-yellow flex items-center justify-between animate-bounce-short">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-full bg-hsu-yellow text-hsu-blue flex items-center justify-center font-black text-sm shadow">
                                    🎁
                                </div>
                                <div>
                                    <div className="text-xs font-bold text-hsu-yellow flex items-center gap-1">
                                        +2pt 적립 완료! <span className="text-[10px] bg-hsu-pink text-white px-1.5 rounded">주간 {userPoints}/20pt</span>
                                    </div>
                                    <div className="text-[11px] text-gray-300">활동 인증 및 매너 평가 감사드립니다!</div>
                                </div>
                            </div>
                            <button onClick={() => setRewardToast(false)} className="text-gray-400 text-xs px-1">✕</button>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA BY TAB */}
                    <div className="flex-1 overflow-y-auto no-scrollbar relative pb-28">
                        
                        {/* 1. HOME / FEED TAB */}
                        {activeTab === 'feed' && (
                            <div className="p-4 space-y-3.5">
                                
                                {/* Category Filter Chips */}
                                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                                    {categories.map(cat => (
                                        <button
                                            key={cat.id}
                                            onClick={() => setSelectedCategory(cat.id)}
                                            className={`px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 whitespace-nowrap transition-all shadow-sm ${
                                                selectedCategory === cat.id
                                                    ? 'bg-hsu-blue text-white shadow-md scale-105'
                                                    : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
                                            }`}
                                        >
                                            <span>{cat.icon}</span>
                                            <span>{cat.label}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Date Filter Bar */}
                                <div className="bg-white p-2.5 rounded-2xl border border-blue-100 shadow-card flex items-center justify-between text-xs">
                                    <div className="flex items-center gap-1.5 font-bold text-gray-700">
                                        <i className="fa-regular fa-calendar-check text-hsu-blue text-sm"></i>
                                        <span>일자 선택:</span>
                                    </div>
                                    
                                    <div className="flex items-center gap-1">
                                        {['전체', '오늘', '내일'].map(filter => (
                                            <button
                                                key={filter}
                                                onClick={() => {
                                                    setSelectedDateFilter(filter);
                                                    setCustomDate('');
                                                }}
                                                className={`px-2.5 py-1 rounded-lg font-semibold text-[11px] transition-all ${
                                                    selectedDateFilter === filter && !customDate
                                                        ? 'bg-blue-50 text-hsu-blue border border-blue-200 font-bold'
                                                        : 'text-gray-500 hover:bg-gray-50'
                                                }`}
                                            >
                                                {filter}
                                            </button>
                                        ))}

                                        {/* Date Picker Button */}
                                        <button
                                            onClick={() => setIsDatePickerOpen(!isDatePickerOpen)}
                                            className={`px-2.5 py-1 rounded-lg font-semibold text-[11px] flex items-center gap-1 transition-all ${
                                                selectedDateFilter === 'CUSTOM'
                                                    ? 'bg-hsu-pink text-white font-bold shadow-sm'
                                                    : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                            }`}
                                        >
                                            <span>📅</span>
                                            <span>{customDate ? customDate.slice(5) : '날짜 선택'}</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Date Picker Dropdown/Modal */}
                                {isDatePickerOpen && (
                                    <div className="bg-white p-3 rounded-xl border border-hsu-pink/30 shadow-lg text-xs space-y-2 animate-fadeIn">
                                        <div className="flex items-center justify-between font-bold text-gray-700 pb-1 border-b">
                                            <span>모임 날짜 직접 지정</span>
                                            <button onClick={() => setIsDatePickerOpen(false)} className="text-gray-400">✕</button>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="date"
                                                value={customDate}
                                                onChange={(e) => {
                                                    setCustomDate(e.target.value);
                                                    setSelectedDateFilter('CUSTOM');
                                                    setIsDatePickerOpen(false);
                                                }}
                                                className="w-full p-2 border rounded-lg text-xs text-gray-700 focus:outline-none focus:border-hsu-blue"
                                            />
                                        </div>
                                    </div>
                                )}

                                {/* Posts Feed List */}
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between px-1">
                                        <span className="text-xs font-bold text-gray-500">
                                            매칭중인 한성팟 모임 ({filteredPosts.length})
                                        </span>
                                        <span className="text-[11px] text-hsu-blue font-semibold flex items-center gap-1">
                                            <i className="fa-solid fa-shield-halved"></i> 학번 인증 100%
                                        </span>
                                    </div>

                                    {filteredPosts.length === 0 ? (
                                        <div className="bg-white rounded-2xl p-8 text-center border border-dashed border-gray-300 my-4">
                                            <div className="text-3xl mb-2">🐢</div>
                                            <p className="text-xs font-bold text-gray-600">선택하신 날짜/카테고리에 모임이 없어요.</p>
                                            <p className="text-[11px] text-gray-400 mt-1">우측 하단 버튼으로 첫 방을 직접 만들어보세요!</p>
                                        </div>
                                    ) : (
                                        filteredPosts.map(post => (
                                            <div
                                                key={post.id}
                                                onClick={() => setSelectedPost(post)}
                                                className="bg-white rounded-2xl p-4 shadow-card hover:shadow-md transition-all border border-gray-100 cursor-pointer relative overflow-hidden group"
                                            >
                                                {/* Left Indicator Ribbon */}
                                                <div className="absolute top-0 left-0 bottom-0 w-1.5 bg-hsu-blue"></div>

                                                <div className="flex items-start justify-between gap-2 mb-2">
                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                        <span className="bg-blue-50 text-hsu-blue text-[11px] font-bold px-2 py-0.5 rounded-md flex items-center gap-1">
                                                            {post.categoryIcon} {post.category}
                                                        </span>
                                                        <span className="bg-pink-50 text-hsu-pink text-[11px] font-bold px-2 py-0.5 rounded-md">
                                                            📅 {post.dateLabel} {post.time}
                                                        </span>
                                                        {post.isMultilingual && (
                                                            <span className="bg-amber-50 text-amber-700 text-[10px] font-bold px-1.5 py-0.5 rounded border border-amber-200">
                                                                🌐 다국어번역
                                                            </span>
                                                        )}
                                                    </div>
                                                    
                                                    {/* Status & Member Count Badge */}
                                                    <div className="bg-hsu-blue text-white text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow-sm flex items-center gap-1">
                                                        <span>{post.currentMembers}/{post.maxMembers}명</span>
                                                    </div>
                                                </div>

                                                {/* Title */}
                                                <h3 className="text-sm font-bold text-gray-800 mb-1 group-hover:text-hsu-blue transition-colors line-clamp-1">
                                                    {post.title}
                                                </h3>

                                                {/* Description preview */}
                                                <p className="text-xs text-gray-500 line-clamp-1 mb-2.5">
                                                    {post.description}
                                                </p>

                                                {/* Location & Host Footer */}
                                                <div className="flex items-center justify-between text-[11px] text-gray-400 pt-2 border-t border-gray-100">
                                                    <span className="flex items-center gap-1 text-gray-600 font-medium">
                                                        📍 {post.location}
                                                    </span>
                                                    <span className="text-gray-400">
                                                        {post.host} ({post.hostRole.split(' ')[0]})
                                                    </span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 2. CHAT & MEETING ACTIVITY TAB */}
                        {activeTab === 'chat' && (
                            <div className="flex flex-col h-full bg-slate-50">
                                {activeChatPost ? (
                                    <div className="flex flex-col h-full">
                                        {/* Pinned Meeting Header Bar */}
                                        <div className="bg-white p-3.5 border-b shadow-sm sticky top-0 z-10">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="bg-hsu-blue text-white text-[10px] font-bold px-2 py-0.5 rounded">
                                                    [{activeChatPost.category}] {activeChatPost.dateLabel} {activeChatPost.time}
                                                </span>
                                                <span className="text-xs text-emerald-600 font-bold flex items-center gap-1">
                                                    🟢 매칭완료 ({activeChatPost.currentMembers}/{activeChatPost.maxMembers}명)
                                                </span>
                                            </div>
                                            <h2 className="text-xs font-bold text-gray-800 mb-1 line-clamp-1">{activeChatPost.title}</h2>
                                            <div className="flex items-center justify-between text-[11px] text-gray-500">
                                                <span>📍 장소: {activeChatPost.location}</span>
                                                <button
                                                    onClick={() => setIsReviewModalOpen(true)}
                                                    className="bg-hsu-pink text-white text-[11px] font-bold px-2.5 py-1 rounded-lg shadow hover:bg-pink-600 transition-all flex items-center gap-1"
                                                >
                                                    <span>📸 활동 인증 & 매너평가 (+2pt)</span>

                                                            ? 'bg-hsu-pink text-white border-hsu-pink shadow-sm'
                                                            : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                                                    }`}
                                                >
                                                    {badge}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Step 3: Review Text */}
                                    <div>
                                        <label className="block font-bold text-gray-700 mb-1">3. 소소한 한 줄 후기</label>
                                        <input
                                            type="text"
                                            value={reviewText}
                                            onChange={(e) => setReviewText(e.target.value)}
                                            placeholder="다들 친절하셔서 맛있는 점심 먹었습니다!"
                                            className="w-full p-2.5 border rounded-xl focus:outline-none focus:border-hsu-blue text-xs"
                                        />
                                    </div>

                                    {/* Submit & Claim Points */}
                                    <button
                                        onClick={handleCompleteActivity}
                                        className="w-full py-3.5 bg-gradient-to-r from-hsu-blue to-hsu-pink text-white rounded-xl font-black text-xs shadow-md hover:opacity-95 transition-all flex items-center justify-center gap-1.5"
                                    >
                                        <span>인증 완료하고 +2pt 받기</span>
                                        <span className="text-hsu-yellow">🎁</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render React App after load
        window.onload = function() {
            ReactDOM.render(<App />, document.getElementById('root'));
            if (window.lucide) {
                lucide.createIcons();
            }
        };
    </script>
</body>
</html>
